kind = "web"
previewPath = "/"
title = "HookFlow"
version = "1.0.0"
id = "artifacts/hookflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20384
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/hookflow run dev"

[services.env]
PORT = "20384"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/hookflow", "run", "build"]
publicDir = "artifacts/hookflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
